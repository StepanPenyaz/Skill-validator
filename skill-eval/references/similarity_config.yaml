# Similarity profiles for skill-eval's step 4b (compute_similarity.py).
# Similarity scores a produced OUTPUT against the verified output for the
# same input. It is not a score for the skill. See similarity-profiles.md.
#
# Pick a profile per skill in <skill>/evals/similarity.yaml:
#
#   profile: document
#   weights: {fact_recall: 0.7, content_overlap: 0.2, structure: 0.1}   # optional
#   required_sections: [Summary, Steps]                                  # optional
#
# Any key under the profile below can be overridden there. Without that file
# the default profile is used.

default_profile: document

profiles:
  document:
    status: implemented
    description: Structured text such as tickets, specs and reports.
    weights:
      fact_recall: 0.60      # share of concrete facts from the verified output found in the produced one
      content_overlap: 0.25  # unigram + bigram F1 between the two texts
      structure: 0.15        # required sections present, and item count close to the verified one
    required_sections: [Title, Description, AC]
    count_section: AC        # section whose numbered items are counted
    # Units that change the meaning of a number: "5 min" and "5 attempts" are
    # different facts, "5 minutes" and "5 min" are the same one. Numbers
    # followed by any other word are compared as bare numbers.
    unit_aliases:
      ms: ms
      milliseconds: ms
      millisecond: ms
      s: s
      sec: s
      secs: s
      second: s
      seconds: s
      min: min
      mins: min
      minute: min
      minutes: min
      h: h
      hour: h
      hours: h
      day: day
      days: day
      "%": "%"
      kb: kb
      mb: mb
      gb: gb

  structured-data:
    status: planned
    description: JSON, YAML or CSV. Field-level exact match on keys and values.

  code:
    status: planned
    description: Code or scripts. Share of checks (tests) that pass, using a command given in evals/similarity.yaml.

  classification:
    status: planned
    description: Labels or decisions. Exact-match accuracy over the cases.
