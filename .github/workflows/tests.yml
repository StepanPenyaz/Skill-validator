name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill-eval:
    name: skill-eval regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r skill-eval/requirements.txt

      # skill-eval/tests/run_regression.py covers both halves of this
      # skill: the static-review checks absorbed from the former
      # skill-review skill (structural_check.py against every fixture,
      # reconcile_reviews.py, diff_reviews.py) and the cost/execution
      # layer's scriptable parts (models_config.yaml's shape,
      # render_report.py's table rendering, a self-check, packaging) —
      # not anything requiring a live model call (task execution,
      # judgment-writing, the qualitative full review mode itself).
      - name: Run skill-eval's regression suite
        run: python3 skill-eval/tests/run_regression.py

      # A clean structural_check.py run doesn't guarantee the skill still
      # packages — this exercises the same "exactly one shipped SKILL.md"
      # rule package_skill.py enforces, so a packaging regression fails CI
      # too, not just a local `git push` surprise.
      - name: Verify skill-eval still packages cleanly
        run: python3 scripts/package_skill.py skill-eval /tmp/dist
